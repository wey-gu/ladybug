name: Maintenance input validation

on:
  pull_request:
    branches: [rust_Port]
  push:
    branches: [rust_Port]

permissions:
  contents: read

jobs:
  json-string-rust-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the Rust API toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt
      - name: Check scalar fixture formatting
        run: rustfmt +1.98.1 --edition 2021 --check tools/rust_api/tests/json_get_string.rs
      - name: Strict scalar fixture lint
        run: >-
          cargo +1.98.1 clippy --manifest-path tools/rust_api/Cargo.toml
          --locked --no-default-features --test json_get_string -j 2 -- -D warnings
      - name: Reuse the completed native build for the test binary
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          source = Path.cwd().resolve()
          trees = []
          for cache in Path('tools/rust_api/target/debug/build').glob('lbug-*/out/build/CMakeCache.txt'):
              entries = dict(line.split('=', 1) for line in cache.read_text().splitlines()
                             if line and not line.startswith(('#', '//')) and '=' in line)
              if (entries.get('CMAKE_BUILD_TYPE:STRING') == 'Debug'
                      and Path(entries.get('CMAKE_HOME_DIRECTORY:INTERNAL', '')).resolve() == source):
                  trees.append(cache.parent.resolve())
          if len(trees) != 1:
              raise SystemExit(f'Expected one completed native build, found {trees}')
          tree = trees[0]
          if not (tree / 'src/liblbug.a').is_file():
              raise SystemExit('Completed native static library is missing')
          receipt = {'source_head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                     'profile': 'Debug', 'cmake_tree': str(tree)}
          Path('json-native-build-reuse.json').write_text(json.dumps(receipt, indent=2) + '\n')
          with Path(os.environ['GITHUB_ENV']).open('a') as output:
              output.write(f'LBUG_CMAKE_BUILD_DIR={tree}\n')
          print(json.dumps(receipt))
          PY
      - name: Execute statically linked JSON scalar queries
        run: >-
          cargo +1.98.1 test --manifest-path tools/rust_api/Cargo.toml
          --locked --no-default-features --test json_get_string -j 2 -- --test-threads=1
      - name: Retain native build reuse receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: json-native-build-reuse
          path: json-native-build-reuse.json
          if-no-files-found: warn

  native-release:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure assertion-free maintenance tests
        run: >-
          cmake -S . -B build/maintenance-validation -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DENABLE_RUNTIME_CHECKS=OFF
          -DBUILD_TESTS=ON -DBUILD_EXTENSION_TESTS=OFF -DBUILD_SHELL=OFF
      - name: Build bounded regression targets
        run: cmake --build build/maintenance-validation --target input_validation_test string_chunk_scan_test simd_capabilities_test -j 8
      - name: Run input and existing string-scan regressions
        run: >-
          ctest --test-dir build/maintenance-validation/test --output-on-failure --no-tests=error
          -R '^(InputValidationTest|StringChunkScanTest)\.|^SimdCapabilitiesTest$'

  empty-index-checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure paired-header regression with runtime assertions
        run: >-
          cmake -S . -B build/empty-index-validation -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DENABLE_RUNTIME_CHECKS=ON
          -DBUILD_TESTS=ON -DBUILD_EXTENSION_TESTS=OFF -DBUILD_SHELL=OFF
      - name: Build the native fixture runner
        run: cmake --build build/empty-index-validation --target e2e_test -j 8
      - name: Prove fixed, old-production and restored checkpoint behavior
        run: bash scripts/test-empty-index-checkpoint.sh build/empty-index-validation
      - name: Retain differential logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: empty-index-checkpoint-evidence
          path: build/empty-index-validation/empty-index-evidence/
          if-no-files-found: warn
